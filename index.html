<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Message</title>
  <style>
    body {
      background-color: #0d1117;
      color: #58a6ff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .card {
      border: 1px solid #30363d;
      padding: 40px;
      border-radius: 12px;
      background: #161b22;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      max-width: 80%;
    }
    h1 {
      color: #3fb950;
      font-size: 2.5rem;
      margin-bottom: 20px;
    }
    p {
      color: #c9d1d9;
      font-size: 1.2rem;
      line-height: 1.6;
    }
    .heart {
      color: #f85149;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>&gt; Congratulazioni! 🎉</h1>
    <p>System.out.println("<span class="heart">♥</span> Bravissimo amore <span class="heart">♥</span>");</p>
    <p style="margin-top: 30px; font-size: 0.9rem; color: #8b949e;">
      // Status: Success<br>
      // Dottore 🎓🎂
    </p>
  </div>
</body>
</html>
